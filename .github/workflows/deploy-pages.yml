# Publica os três apps no GitHub Pages como sites estáticos:
#   <site>/           -> container (host)
#   <site>/cardapio/  -> micro Cardápio (remote)
#   <site>/pedido/    -> micro Pedido (remote)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependências
        run: npm ci

      - name: Build dos remotes
        env:
          STATIC_EXPORT: 'true'
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}/cardapio" npm run build -w cardapio
          BASE_PATH="${{ steps.pages.outputs.base_path }}/pedido" npm run build -w pedido

      - name: Build do container
        env:
          STATIC_EXPORT: 'true'
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CARDAPIO_URL: ${{ steps.pages.outputs.base_url }}/cardapio
          PEDIDO_URL: ${{ steps.pages.outputs.base_url }}/pedido
        run: npm run build -w container

      - name: Montar o site
        run: |
          mkdir site
          cp -r apps/container/out/. site/
          cp -r apps/cardapio/out site/cardapio
          cp -r apps/pedido/out site/pedido
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
